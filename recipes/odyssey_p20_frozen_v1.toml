# Reproduces the accepted diagnostic fine-grid settings, not a released preset.
schema_version = 1
id = "odyssey_p20_frozen_v1"
version = "1.0.0"
planet = "mars"

[time]
epoch_utc = "2001-11-07T11:51:04.794789Z"
scale = "UTC"
scale_code = 1
frame = "planet_event_time"
frame_code = 0
elapsed_seconds = 0.0

[coordinates]
latitude = "geodetic"
height = "ellipsoidal_km"
longitude = "east_positive_periodic_degrees"
radii_mode = "explicit"
equatorial_radius_km = 3396.190
polar_radius_km = 3376.200

[atmosphere]
seed = 1001
perturbation_action = false
perturbation_scales = [0.0, 0.0, 0.0, 0.0]
wind_product = "nominal_mean_ENU"

[mars]
map_year = 2
min_max = 1
mola_heights = false
dust_mode = "native-default"

[grid]
altitude_bounds_km = [100.0, 260.0]
altitude_step_km = 1.0
latitude_bounds_deg = [40.0, 90.0]
latitude_step_deg = 1.0
longitude_bounds_deg = [0.0, 360.0]
longitude_step_deg = 2.5
longitude_endpoint = "periodic_without_duplicate"
field_type = "Float64"

[provenance]
